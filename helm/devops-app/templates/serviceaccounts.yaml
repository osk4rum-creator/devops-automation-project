# One ServiceAccount (identity) per component instead of sharing "default".
# None of the apps call the Kubernetes API, so no RBAC permissions are granted
# and the API token is not even mounted into the pods.
{{- range $name := list "frontend" "backend" "worker" "postgres" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" $name | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
