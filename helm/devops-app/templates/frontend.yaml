# Frontend (nginx): the ONLY component reachable from outside, via the Ingress.
# Serves the web page and forwards /api/ to the backend Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "app.labels" "frontend" | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" "frontend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" "frontend" | nindent 8 }}
    spec:
      serviceAccountName: frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                    # "nginx" user of the unprivileged image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: {{ include "app.image" (dict "root" $ "name" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # Full DNS name: nginx's resolver doesn't use the short-name search list
            - name: BACKEND_HOST
              value: backend.{{ .Release.Namespace }}.svc.cluster.local
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # /healthz is answered by nginx itself, so the frontend stays up
          # even if the backend is down (the page then shows "unreachable").
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp             # nginx writes its pid and cache here
            - name: conf
              mountPath: /etc/nginx/conf.d  # the config generated from the template
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "app.labels" "frontend" | nindent 4 }}
spec:
  type: ClusterIP                         # still internal; the Ingress is the public door
  selector:
    {{- include "app.selectorLabels" "frontend" | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
