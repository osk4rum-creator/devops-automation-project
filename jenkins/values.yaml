# Jenkins installation, fully as code.
#   Chart:   jenkins/jenkins 5.10.2   (https://charts.jenkins.io)
#   Jenkins: 2.580.2 LTS
# Installed by scripts/install-jenkins.sh. Every setting below replaces a
# manual click in the Jenkins UI (Jenkins Configuration as Code = JCasC).

controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.580.2-jdk25"            # pinned, never latest
  # The controller only schedules work - all builds run in agent pods.
  numExecutors: 0
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  # Chart defaults kept: runs as UID 1000 (non-root), read-only root
  # filesystem, no privilege escalation, liveness/readiness/startup probes.

  # UI at http://jenkins.localhost:8080 via the k3d ingress (Traefik).
  # Only reachable from this machine; not exposed to the internet.
  jenkinsUrl: http://jenkins.localhost:8080
  ingress:
    enabled: true
    ingressClassName: traefik
    hostName: jenkins.localhost
    path: /

  # --- Plugins: FULL lock list, every plugin at an exact version ---------------
  # The plugins we chose are in jenkins/plugins.txt (kubernetes, pipeline, git,
  # github, JCasC, job-dsl, credentials-binding, ...). The list below is that
  # set PLUS all dependencies, generated by scripts/lock-plugins.sh.
  # Don't edit by hand: change plugins.txt and re-run the script.
  installPlugins:
