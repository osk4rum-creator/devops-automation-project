    # END PLUGIN LOCK
  installLatestPlugins: false       # install exactly the list above, nothing newer
  installLatestSpecifiedPlugins: false

  # Secret values are mounted from Kubernetes Secrets and referenced in JCasC
  # as ${<secret>-<key>}. The values themselves never appear in Git.
  additionalExistingSecrets:
    - name: jenkins-ghcr
      keyName: username
    - name: jenkins-ghcr
      keyName: token

  JCasC:
    defaultConfig: true             # chart default: admin login, Kubernetes cloud, URL
    configScripts:
      # Credentials Jenkins can use - values come from Secret "jenkins-ghcr"
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: ghcr
                      description: "GitHub Container Registry (push images) - from Secret jenkins-ghcr"
                      username: "${jenkins-ghcr-username}"
                      password: "${jenkins-ghcr-token}"

      # The two pipeline jobs, created by Job DSL - nobody creates jobs in the UI.
      jobs: |
        jobs:
          - script: |
              def repo = 'https://github.com/osk4rum-creator/devops-automation-project.git'

              pipelineJob('application-ci') {
                description('CI - lint, test, build, scan and push images. Never deploys. Triggered by GitHub push.')
                logRotator { numToKeep(20) }
                properties {
                  pipelineTriggers { triggers { githubPush() } }
                }
                definition {
                  cpsScm {
                    scm { git { remote { url(repo) }; branch('*/main') } }
                    scriptPath('Jenkinsfile-ci')
                    lightweight(true)
                  }
                }
              }

              pipelineJob('application-cd') {
                description('CD - deploys an image tag that CI already built and pushed. Never builds.')
                logRotator { numToKeep(20) }
                parameters {
                  stringParam('IMAGE_TAG', '', 'Immutable image tag produced by application-ci (git short SHA). "latest" is rejected.')
                  choiceParam('ENVIRONMENT', ['devops-app'], 'Target namespace')
                  stringParam('CI_BUILD', '', 'URL of the CI build that produced the tag (traceability)')
                }
                definition {
                  cpsScm {
                    scm { git { remote { url(repo) }; branch('*/main') } }
                    scriptPath('Jenkinsfile-cd')
                    lightweight(true)
                  }
                }
              }

# --- Agents: one pod per build, deleted afterwards ---------------------------
agent:
  enabled: true
  disableDefaultAgent: true         # only our two templates below exist
  websocket: true                   # agents connect over HTTP(S) - no extra port 50000
  restrictedPssSecurityContext: false   # we set securityContext ourselves per container
  podRetention: Never
  podTemplates:
    # CI agent: tests, Dockerfile lint, image build (BuildKit rootless),
    # vulnerability scan (Trivy) and push (crane). No Kubernetes permissions.
    ci: |
      - name: ci
        label: ci
        serviceAccount: jenkins-agent-ci
        yamlMergeStrategy: override
        yaml: |
          apiVersion: v1
          kind: Pod
          metadata:
            labels:
              jenkins/agent-role: ci
          spec:
            automountServiceAccountToken: false     # CI never talks to the Kubernetes API
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile: { type: RuntimeDefault }
            containers:
              - name: jnlp
                image: jenkins/inbound-agent:3395.v6e5377b_0fb_3c-1-jdk25
                resources:
                  requests: { cpu: 100m, memory: 256Mi }
                  limits: { cpu: 500m, memory: 512Mi }
                securityContext: &restricted
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
              - name: python
                image: python:3.12.16-slim
                command: ["sleep"]
                args: ["infinity"]
                env:
                  - { name: HOME, value: /tmp }
                  - { name: PIP_DISABLE_PIP_VERSION_CHECK, value: "1" }
                resources:
                  requests: { cpu: 200m, memory: 256Mi }
                  limits: { cpu: "1", memory: 1Gi }
                securityContext: *restricted
              - name: hadolint
                image: hadolint/hadolint:v2.15.1-debian
                command: ["sleep"]
                args: ["infinity"]
                resources:
                  requests: { cpu: 50m, memory: 64Mi }
                  limits: { cpu: 200m, memory: 128Mi }
                securityContext: *restricted
              # Rootless BuildKit: builds images WITHOUT the node's Docker socket
              # and without privileged mode. Trade-off: it needs an unconfined
              # seccomp/AppArmor profile to create its user namespace.
              - name: buildkit
                image: moby/buildkit:v0.34.1-rootless
                command: ["sleep"]
                args: ["infinity"]
                env:
                  - { name: BUILDKITD_FLAGS, value: "--oci-worker-no-process-sandbox" }
                resources:
                  requests: { cpu: 500m, memory: 512Mi }
                  limits: { cpu: "2", memory: 2Gi }
                securityContext:
                  runAsUser: 1000
                  runAsGroup: 1000
                  seccompProfile: { type: Unconfined }
                  appArmorProfile: { type: Unconfined }
                volumeMounts:
                  - { name: buildkitd, mountPath: /home/user/.local/share/buildkit }
              - name: trivy
                image: aquasec/trivy:0.76.1
                command: ["sleep"]
                args: ["infinity"]
                env:
                  - { name: HOME, value: /tmp }
                  - { name: TRIVY_CACHE_DIR, value: /tmp/trivy-cache }
                resources:
                  requests: { cpu: 200m, memory: 256Mi }
                  limits: { cpu: "1", memory: 1Gi }
                securityContext: *restricted
              - name: crane
                image: gcr.io/go-containerregistry/crane:v0.22.1-debug
                command: ["/busybox/sleep"]
                args: ["infinity"]
                env:
                  - { name: HOME, value: /tmp }
                resources:
                  requests: { cpu: 50m, memory: 64Mi }
                  limits: { cpu: 500m, memory: 256Mi }
                securityContext: *restricted
            volumes:
              - name: buildkitd
                emptyDir: {}

    # CD agent: kubectl + helm only. Its ServiceAccount may deploy into the
    # devops-app namespace and nothing else (see jenkins/rbac.yaml).
    cd: |
      - name: cd
        label: cd
        serviceAccount: jenkins-deployer
        yamlMergeStrategy: override
        yaml: |
          apiVersion: v1
          kind: Pod
          metadata:
            labels:
              jenkins/agent-role: cd               # allowed by the app's NetworkPolicy (smoke test)
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile: { type: RuntimeDefault }
            containers:
              - name: jnlp
                image: jenkins/inbound-agent:3395.v6e5377b_0fb_3c-1-jdk25
                resources:
                  requests: { cpu: 100m, memory: 256Mi }
                  limits: { cpu: 500m, memory: 512Mi }
                securityContext: &restricted
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
              - name: k8s
                image: alpine/k8s:1.35.9                  # kubectl + helm, same minor as the cluster
                command: ["sleep"]
                args: ["infinity"]
                env:
                  - { name: HOME, value: /tmp }
                resources:
                  requests: { cpu: 100m, memory: 128Mi }
                  limits: { cpu: 500m, memory: 512Mi }
                securityContext: *restricted
              - name: crane
                image: gcr.io/go-containerregistry/crane:v0.22.1-debug
                command: ["/busybox/sleep"]
                args: ["infinity"]
                env:
                  - { name: HOME, value: /tmp }
                resources:
                  requests: { cpu: 50m, memory: 64Mi }
                  limits: { cpu: 200m, memory: 128Mi }
                securityContext: *restricted

# --- Storage: Jenkins home survives pod restarts --------------------------------
persistence:
  enabled: true
  storageClass: local-path          # k3d's built-in storage
  size: 8Gi

rbac:
  create: true                      # controller may create/delete agent pods in "jenkins" only
  readSecrets: false
