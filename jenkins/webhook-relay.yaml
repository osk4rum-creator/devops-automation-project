# GitHub webhook relay (smee.io).
#
#   GitHub --push event--> https://smee.io/<channel> <--outbound connection-- this pod --> Jenkins
#
# Jenkins is NOT reachable from the internet. This pod opens an OUTBOUND
# connection to smee.io, receives GitHub's push events and forwards them to
# Jenkins' /github-webhook/ endpoint inside the cluster.
# The channel URL comes from Secret "smee-channel" (created by
# scripts/install-webhook-relay.sh) - anyone who knows it could send fake
# events, so it isn't committed. A fake event can only make Jenkins check
# GitHub for new commits; it can't inject code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-relay
  namespace: jenkins
  labels: { app.kubernetes.io/name: webhook-relay }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: webhook-relay }
  template:
    metadata:
      labels: { app.kubernetes.io/name: webhook-relay }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                 # "node" user of the image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: smee
          image: node:22.23.4-alpine
          # smee-client 2.0.4, not 5.x: 5.0.0 strips the trailing "/" from --target,
          # and Jenkins answers POST /github-webhook (no slash) with 405.
          command: ["npx", "--yes", "smee-client@2.0.4",
                    "--url", "$(SMEE_URL)",
                    "--target", "http://jenkins.jenkins.svc.cluster.local:8080/github-webhook/"]
          env:
            - name: SMEE_URL
              valueFrom: { secretKeyRef: { name: smee-channel, key: url } }
            - { name: HOME, value: /tmp }                 # npm cache
            - { name: npm_config_update_notifier, value: "false" }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
