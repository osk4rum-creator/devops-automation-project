# EXAMPLE ONLY - fake values. Real secrets are never committed to Git.
#
# scripts/deploy-local.sh creates the real secrets from files in secrets/
# (which is gitignored):
#   secrets/db.env   -> Secret "db-credentials"  (generated automatically if missing)
#   secrets/aws.env  -> Secret "aws-credentials" (optional; enables S3 + SNS)
#
# Manual alternative:
#   kubectl create secret generic db-credentials -n devops-app --from-env-file=secrets/db.env
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: devops-app
type: Opaque
stringData:
  DB_USER: app
  DB_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: devops-app
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: AKIAEXAMPLEEXAMPLE
  AWS_SECRET_ACCESS_KEY: change-me
